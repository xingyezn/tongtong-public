# Isolated local/LAN test backend. Copy to config.test.yaml before use.
environment: "test"

face_service:
  # Keep the recognition service separate from the 8081 backend listener.
  base_url: "http://127.0.0.1:8090"
  username: ""
  password: ""

weather:
  default_timezone: "Asia/Shanghai"
  timeout_seconds: 12

music:
  catalog_path: "data/music/catalog.json"
  audio_directory: "data/music/audio"
  opus_directory: "data/music/opus"
  max_preview_seconds: 30

server:
  host: "0.0.0.0"
  port: 8082
  # scripts/start_test_backend.ps1 overrides this with the selected LAN host.
  public_ws_url: "ws://127.0.0.1:8082/ws"

dashscope:
  api_key: ""
  model: "qwen3.5-omni-plus-realtime"
  workspace_id: ""
  realtime_url: "wss://{workspace}.cn-beijing.maas.aliyuncs.com/api-ws/v1/realtime"
  language: "zh"
  voice: "Ethan"
  instructions: "You are Tongtong, a friendly voice assistant. Reply briefly in natural Chinese."
  output_sample_rate: 24000
  input_sample_rate: 16000

audio:
  opus_frame_ms: 60
  omni_input_format: "wav"
  omni_output_format: "wav"
  # Public test service: trade a little initial latency for uninterrupted TTS.
  tts_startup_buffer_ms: 900

devices:
  enabled: false
  tokens: {}

logging:
  level: "INFO"

vad:
  silence_duration_ms: 600
  energy_threshold: 600.0

dashboard:
  session_ttl: 86400
  registration_enabled: true

storage:
  # Never point a test process at the production database.
  database: "data/test/tongtong-test.db"

memory:
  enabled: true
  model: "qwen3.8-max"
  compatible_url: ""
  max_memories_per_run: 12
