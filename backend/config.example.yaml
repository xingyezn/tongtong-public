# Public-safe backend configuration example.
# Use private/local.example.yaml plus scripts/configure_local.py for real values.
environment: "production"

face_service:
  # Server-side YuNet/SFace face management service.
  base_url: "http://127.0.0.1:8090"
  username: ""
  password: ""
weather:
  # IANA timezone used when the user asks for the current time without a location.
  default_timezone: "Asia/Shanghai"
  timeout_seconds: 12

music:
  catalog_path: "data/music/catalog.json"
  audio_directory: "data/music/audio"
  opus_directory: "data/music/opus"
  max_preview_seconds: 30

server:
  host: "0.0.0.0"
  port: 8080
  public_ws_url: "wss://your-server.example/ws"

dashscope:
  api_key: ""
  model: "qwen3.5-omni-plus-realtime"
  workspace_id: ""
  realtime_url: "wss://{workspace}.cn-beijing.maas.aliyuncs.com/api-ws/v1/realtime"
  language: "zh"
  voice: "Ethan"
  instructions: "You are Tongtong, a friendly voice assistant. Reply briefly in natural Chinese."
  output_sample_rate: 24000
  input_sample_rate: 16000

audio:
  opus_frame_ms: 60
  omni_input_format: "wav"
  omni_output_format: "wav"
  # Keep 0.9 s of model audio before device playback to prevent stream jitter.
  # Valid range: 240-1500 ms.  Lower only on a stable LAN after testing.
  tts_startup_buffer_ms: 900

devices:
  enabled: false
  tokens: {}

logging:
  level: "INFO"

vad:
  # Tuned for the on-board microphone and speaker; prevents idle noise and
  # speaker tail from being treated as a new voice command.
  silence_duration_ms: 600
  energy_threshold: 600.0

dashboard:
  session_ttl: 86400
  registration_enabled: true

storage:
  database: "data/tongtong.db"
  # Firmware binaries are kept outside Git; metadata is stored in SQLite.
  firmware_directory: "data/firmware"

memory:
  enabled: true
  model: "qwen3.8-max"
  # Empty means https://{workspace_id}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
  compatible_url: ""
  max_memories_per_run: 12
